<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interactive Stopwatch</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="container">

    <div class="stopwatch">

      <h1>Stopwatch</h1>

      <div id="display">
        00:00:00:00
      </div>

      <div class="buttons">

        <button class="start" onclick="startWatch()">
          Start
        </button>

        <button class="pause" onclick="pauseWatch()">
          Pause
        </button>

        <button class="reset" onclick="resetWatch()">
          Reset
        </button>

        <button class="lap" onclick="lapWatch()">
          Lap
        </button>

      </div>

      <div class="laps-box">
        <h2>Lap Times</h2>

        <ul id="laps"></ul>
      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
